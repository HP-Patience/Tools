<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="s-title s-desc">
  <title id="s-title">为什么子仓不并入本仓</title>
  <desc id="s-desc">两行对比：直接把带 .git 的工具目录全量提交，会被外层仓库记成 gitlink，形成没有 .gitmodules 的假子模块；本仓的做法是用 .gitignore 排除这些目录，外层只保留索引与两个工具，子仓各自提交与推送。</desc>

  <rect width="1200" height="320" rx="22" fill="#0b0f14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="48" y="58" font-size="34" font-weight="700" fill="#f4f1ea">为什么子仓不进本仓</text>
    <text x="48" y="92" font-size="19" fill="#8b93a1">嵌套的 .git 会被外层仓库当成 gitlink，没有 .gitmodules 就是一批假子模块。</text>

    <text x="48" y="162" font-size="19" fill="#8b93a1">直接收录</text>
    <text x="48" y="258" font-size="19" fill="#5fd0bb">本仓做法</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace">
    <!-- 方案 A：直接全量提交 -->
    <g>
      <rect x="140" y="118" width="232" height="78" rx="10" fill="#12161d" stroke="#2a3340"/>
      <text x="160" y="152" font-size="20" fill="#e8e5de">git add .</text>
      <text x="160" y="180" font-size="18" fill="#8b93a1">全量暂存</text>

      <rect x="400" y="118" width="232" height="78" rx="10" fill="#12161d" stroke="#2a3340"/>
      <text x="420" y="152" font-size="20" fill="#e8e5de">外层记 gitlink</text>
      <text x="420" y="180" font-size="18" fill="#8b93a1">没有 .gitmodules</text>

      <rect x="660" y="118" width="232" height="78" rx="10" fill="#12161d" stroke="#2a3340"/>
      <text x="680" y="152" font-size="20" fill="#e8e5de">假子模块</text>
      <text x="680" y="180" font-size="18" fill="#8b93a1">clone 下来是空的</text>

      <rect x="920" y="118" width="232" height="78" rx="10" fill="#191112" stroke="#b8614f"/>
      <text x="940" y="152" font-size="20" fill="#f0b6a6">子仓失联</text>
      <text x="940" y="180" font-size="18" fill="#a08a86">pull / push 都乱</text>

      <g stroke="#5b6878" stroke-width="2.5" fill="none">
        <path d="M380 153 L386 157 L380 161"/>
        <path d="M640 153 L646 157 L640 161"/>
        <path d="M900 153 L906 157 L900 161"/>
      </g>
    </g>

    <!-- 方案 B：本仓做法 -->
    <g>
      <rect x="140" y="214" width="232" height="78" rx="10" fill="#0f1a1a" stroke="#2b4a45"/>
      <text x="160" y="248" font-size="20" fill="#e8e5de">工具目录带 .git</text>
      <text x="160" y="276" font-size="18" fill="#8b93a1">各自独立仓</text>

      <rect x="400" y="214" width="232" height="78" rx="10" fill="#0f1a1a" stroke="#2b4a45"/>
      <text x="420" y="248" font-size="20" fill="#e8e5de">.gitignore 排除</text>
      <text x="420" y="276" font-size="18" fill="#8b93a1">9 个目录</text>

      <rect x="660" y="214" width="232" height="78" rx="10" fill="#0f1a1a" stroke="#2b4a45"/>
      <text x="680" y="248" font-size="20" fill="#e8e5de">外层只留索引</text>
      <text x="680" y="276" font-size="18" fill="#8b93a1">README + 2 个工具</text>

      <rect x="920" y="214" width="232" height="78" rx="10" fill="#0d1c1a" stroke="#5fd0bb"/>
      <text x="940" y="248" font-size="20" fill="#a9e4d6">子仓各自 push</text>
      <text x="940" y="276" font-size="18" fill="#7f9b95">外层 status 干净</text>

      <g stroke="#4e8578" stroke-width="2.5" fill="none">
        <path d="M380 249 L386 253 L380 257"/>
        <path d="M640 249 L646 253 L640 257"/>
        <path d="M900 249 L906 253 L900 257"/>
      </g>
    </g>
  </g>
</svg>
