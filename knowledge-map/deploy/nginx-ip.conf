# Personal IP site. Existing port 80 / 18181 sites are not modified.
server {
    listen 18443 ssl;
    server_name 121.41.92.58;
    ssl_certificate /etc/letsencrypt/live/ai-prompt-optimizer-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-prompt-optimizer-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZhixuTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    auth_basic "Zhixu private knowledge map";
    auth_basic_user_file /etc/nginx/zhixu.htpasswd;
    root /srv/zhixu/current;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/zhixu-error.log warn;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location ^~ /versions/ {
        alias /srv/zhixu/releases/;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
