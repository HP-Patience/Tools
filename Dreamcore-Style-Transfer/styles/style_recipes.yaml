# ============================================================
# 风格配方库 — 10种"核"风格的完整结构化定义
# 每个风格包含: 核心词、视觉特征、场景、情绪、时代参数、模型参数
# ============================================================

styles:
  dreamcore:
    id: "dreamcore"
    name:
      zh: "经典梦核"
      en: "Dreamcore"
    aliases: ["梦核", "dreamcore", "dream core", "梦核风", "梦核风格"]
    description: "怀旧超现实主义梦境景观，模糊熟悉与陌生的边界"
    # ---- 风格配方 ----
    recipe:
      core_keywords: "nostalgic surreal dreamscape"
      visual_features:
        - "soft overexposed lighting"
        - "hazy atmosphere"
        - "high grain"
        - "vintage film quality"
        - "bloom effect"
      typical_scenes:
        - "empty school hallway"
        - "abandoned amusement park"
        - "suburban street at dusk"
        - "overgrown playground"
      mood_atmosphere:
        - "wistful"
        - "familiar yet strange"
        - "comforting yet eerie"
      era_params:
        - "90s film stock"
        - "retro photography"
        - "analog camera"
    # ---- 颜色映射 ----
    color_palette:
      primary: ["warm yellow", "soft pink", "faded orange"]
      secondary: ["muted teal", "dusty lavender"]
      avoid: ["neon", "pure black", "pure white", "digital blue"]
    # ---- 生成参数 ----
    generation_params:
      midjourney:
        ar: "4:3"
        stylize: 750
        chaos: 20
        negative: ["people", "modern", "busy", "realistic", "sharp focus"]
      stable_diffusion:
        steps: 30
        cfg_scale: 7.5
        negative_prompt: "modern architecture, smartphones, realistic, sharp, clean, people, busy, digital art, 3d render"
    # ---- 强度控制 ----
    intensity_presets:
      mild:
        description: "轻微梦核感"
        weight_adjustment: 0.6
      standard:
        description: "标准梦核"
        weight_adjustment: 1.0
      extreme:
        description: "强烈梦核"
        weight_adjustment: 1.4

