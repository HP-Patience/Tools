# Replace subscriptions.example.com and TLS certificate paths before enabling.
server {
    listen 80;
    server_name subscriptions.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name subscriptions.example.com;
    ssl_certificate /etc/letsencrypt/live/subscriptions.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subscriptions.example.com/privkey.pem;
    root /srv/ai-subscriptions/current/frontend/dist;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /health/ { proxy_pass http://127.0.0.1:8000; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { add_header Cache-Control no-store; try_files $uri $uri/ /index.html; }
}
