[project]
name = "subscription-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.3,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "argon2-cffi>=23,<26", "email-validator>=2,<3", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.setuptools.packages.find]
include = ["app*"]
