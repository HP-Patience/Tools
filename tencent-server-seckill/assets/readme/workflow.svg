<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">从设置到订单的执行流程</title>
  <desc id="workflow-desc">选择地域与场次，点击开始抢购并确认。程序自动校验登录态。有效时等待场次并创建订单；未登录或明确过期时显示微信扫码弹窗，校验成功后保存登录态，用户仍需重新点击抢购并确认。网络异常停止并提示，不强制重新扫码。程序不会自动支付。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c7f56d"/></marker>
  </defs>
  <rect width="1200" height="1010" rx="18" fill="#101211"/>
  <g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" text-anchor="middle">
    <text x="600" y="76" fill="#edf1e9" font-size="54" font-weight="650">从设置到订单</text>
    <rect x="238" y="128" width="724" height="132" rx="12" fill="#191c1a" stroke="#30352f" stroke-width="2"/>
    <text x="600" y="183" fill="#edf1e9" font-size="48">选择地域与场次</text>
    <text x="600" y="231" fill="#a4ad9d" font-size="36">点击开始抢购，明确确认</text>
    <path d="M600 268V321" fill="none" stroke="#c7f56d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="238" y="332" width="724" height="108" rx="12" fill="#191c1a" stroke="#8cae4e" stroke-width="2"/>
    <text x="600" y="399" fill="#c7f56d" font-size="48">自动校验登录态</text>
    <path d="M428 450V486H324V534" fill="none" stroke="#c7f56d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M772 450V486H876V534" fill="none" stroke="#c7f56d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="246" y="508" fill="#a4ad9d" font-size="38">需登录</text>
    <text x="970" y="508" fill="#c7f56d" font-size="38">有效</text>
    <rect x="64" y="548" width="520" height="214" rx="12" fill="#191c1a" stroke="#30352f" stroke-width="2"/>
    <text x="324" y="622" fill="#edf1e9" font-size="48">微信扫码</text>
    <text x="324" y="684" fill="#c7f56d" font-size="44">校验后保存登录态</text>
    <text x="324" y="734" fill="#a4ad9d" font-size="34">弹窗期间锁定操作</text>
    <rect x="616" y="548" width="520" height="214" rx="12" fill="#191c1a" stroke="#8cae4e" stroke-width="2"/>
    <text x="876" y="622" fill="#edf1e9" font-size="48">等待目标场次</text>
    <text x="876" y="684" fill="#c7f56d" font-size="48">创建订单</text>
    <text x="876" y="734" fill="#a4ad9d" font-size="34">付款由你自行完成</text>
    <path d="M324 772V820H34V194H223" fill="none" stroke="#c7f56d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="887" fill="#edf1e9" font-size="42">扫码成功后，重新点击抢购并确认</text>
    <text x="600" y="951" fill="#a4ad9d" font-size="36">网络异常：停止并提示，不强制重新登录</text>
  </g>
</svg>
